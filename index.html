<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr Yami Hibachi At Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #c39b50;
      --dark: #121212;
      --light: #fcfcfc;
      --card: #ffffff;
      --border: #e5e5e5;
      --muted: #666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Poppins, sans-serif;
    }

    body {
      background: var(--light);
      color: #222;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.75)),
      url("https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=1600");
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 90px 20px;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      color: var(--gold);
      font-family: "Playfair Display", serif;
      font-size: 3rem;
    }

    header p {
      color: white;
      margin-top: 10px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(0,0,0,.05);
    }

    h2 {
      font-family: "Playfair Display", serif;
      margin-bottom: 18px;
      border-bottom: 2px solid #f2e7d3;
      padding-bottom: 8px;
    }

    h3 {
      color: var(--gold);
      margin: 20px 0 10px;
      text-transform: uppercase;
      font-size: 1rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fafafa;
      font-size: 1rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
    }

    .note {
      color: var(--muted);
      font-size: .85rem;
    }

    .price {
      color: var(--gold);
      font-weight: 700;
    }

    .summary {
      background: #f9f5eb;
      border: 1px solid var(--gold);
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }

    .total {
      font-size: 1.25rem;
      font-weight: 700;
      border-top: 1px solid var(--gold);
      margin-top: 10px;
      padding-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: var(--dark);
      color: var(--gold);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }

    footer {
      background: var(--dark);
      color: #aaa;
      text-align: center;
      padding: 25px;
    }

    @media(max-width: 700px) {
      header h1 {
        font-size: 2.1rem;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mr Yami Hibachi At Home</h1>
  <p>Premium Private Hibachi Catering</p>
</header>

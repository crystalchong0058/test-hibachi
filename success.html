<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Booking Submitted</title>

  <style>
    body {
      font-family: Poppins, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8faf8;
    }

    .card {
      text-align: center;
      background: white;
      padding: 50px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      max-width: 500px;
    }

    .checkmark {
      font-size: 80px;
      color: #28a745;
    }

    h1 {
      margin-top: 15px;
    }

    p {
      color: #666;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #121212;
      color: #c39b50;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="checkmark">✓</div>

  <h1>Booking Submitted!</h1>

  <p>
    Thank you for your booking request.
    We have received your information and
    will contact you shortly.
  </p>

  <p>
    Please check your email for confirmation
    and deposit instructions.
  </p>

  <a href="index.html">
    Return Home
  </a>
</div>

</body>
</html>
